name: Checks
on: [push, pull_request]
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test:unit
      - run: npm run type-check
      - run: npm run lint
      - run: npm run build
      # Review tests play an H.264 MP4 fixture; Google Chrome ships that codec.
      - run: npx playwright install --with-deps chrome
      - run: npm test
        env:
          PLAYWRIGHT_CHANNEL: chrome
  functions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firebase/functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # firebase-admin 14's Firestore/Storage packages need Node 22; on 20 npm
          # silently skips them and the build loses their types.
          node-version: 22
      - run: npm ci
      - run: npm run build
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install poetry==1.8.5
      - run: poetry install
      - run: poetry run pytest tests -v
